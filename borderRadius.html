<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square{
            height: 400px;
            width: 400px;
            border: 3px solid green ;
            border-radius: 20%;
            padding: 10px;
            padding-top: 20px;
        }
        #circle{
            height: 400px;
            width: 400px;
            border: 3px solid navy   ;
            border-radius: 50%;
            padding: 10px;
            background: gray;
            padding-top: 20px;
        }
        #rectange{
            height: 300px;
            width: 600px;
            border: 3px solid skyblue ;
            padding: 10px;
            background: gray;
            padding-top: 20px;
        }
        #d4{
            height: 300px;
            width: 600px;
            border-top-right-radius: 20%;
            border-bottom-left-radius: 20%;
            background: gray;
        }
        #d5{
            height: 200px;
            width: 150px;
            border-top-right-radius: 50%;
            border-top-left-radius: 50%;
            background: red;
        }
        #d6{
            height: 200px;
            width: 150px;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            background: green;
        }
        #d7{
            height: 150px;
            width: 150px;
            border-top-left-radius: 50%;
            background: green;
        }
        #d8{
            height: 150px;
            width: 150px;
            border-bottom-right-radius: 50%;
            background: yellow;
            border : 2px solid red;
        }

    </style>
</head>
<body>
    <div id="square">
        <h1 >kaishe hai aap</h1>
    </div>
    <br>
    <div id="circle"></div>
    <br>
    <div id="rectange"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <br>
    <div id="d7"></div>
    <div id="d8"></div>

</body>
</html>
