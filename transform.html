<!DOCTYPE html>
<html>
<head>
    <style>
        *{
            background: #000;
        }
        .box {
            width: 100px;
            height: 100px;
            background: purple;

            
        }

        .box:hover {
            transform: translateX(100px) scale(1.2);
        }
        .box1{
            width: 100px;
            height : 100px ;
            background-color: red;
            transition: 01.5s;
        }
        .box1:hover{
            transform: translateX(120px) scale(1.2);
        }
    </style>
</head>

<body>

    <div class="box"></div>
    <br>
    <div class="box1"></div>

</body>
</html>
